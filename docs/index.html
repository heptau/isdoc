<!doctype html>
<html lang="cs">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-/+4YSK/YDTKE1qH59czZ7JWOOZRkJS1/c7fBAe36GoQ=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob: about:; object-src 'none'; base-uri 'none'; form-action 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title data-i18n="title">ISDOC Viewer</title>
	<meta name="theme-color" content="#1f4e8c">
	<meta name="description" content="View ISDOC and ISDOCX invoices, check the signature and pay by QR code.">
	<link rel="canonical" href="https://isdoc.80.cz/">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<link rel="stylesheet" href="style.css">
	<script>
		// Set the theme before the first paint (no flash): the saved choice, otherwise the system preference.
		try {
			var t = localStorage.getItem('theme');
			if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			document.documentElement.dataset.theme = t;
		} catch (e) { /* the CSS falls back to the system preference */ }
	</script>
</head>
<body>
	<header class="bar">
		<h1 class="brand"><span class="brand-full" data-i18n="title">ISDOC Viewer</span><span class="brand-short">ISDOC</span></h1>
		<div class="center">
			<label class="btn primary" for="file" data-i18n-attr="title:open,aria-label:open"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 10h19l-2 7.5a2 2 0 0 1-2 1.5H5a2 2 0 0 1-2-2z"/></svg><span class="lbl lbl-long" data-i18n="open">Open file</span><span class="lbl lbl-short" data-i18n="openShort">Open</span></label>
			<input id="file" type="file" accept=".isdoc,.isdocx,.xml,application/xml,text/xml" hidden>
			<button class="btn" id="print" type="button" data-i18n-attr="title:print,aria-label:print" disabled><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><rect x="7" y="14" width="10" height="7"/></svg><span class="lbl" data-i18n="print">Print</span></button>
			<button class="btn" id="sign" type="button" data-i18n-attr="title:sign,aria-label:sign" disabled><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h4l11-11a2.1 2.1 0 0 0-4-4L3 17z"/><path d="M13 7l4 4M14 21h7"/></svg><span class="lbl" data-i18n="sign">Sign</span></button>
		</div>
		<div class="tools">
			<a class="icon-btn heart" id="sponsor" href="https://github.com/sponsors/heptau" target="_blank" rel="noopener" data-i18n-attr="title:sponsor,aria-label:sponsor"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-8-4.6-8-10.3A4.7 4.7 0 0 1 12 7.4a4.7 4.7 0 0 1 8 2.8c0 5.7-8 10.3-8 10.3z"/></svg></a>
			<a class="icon-btn star" id="star" href="https://github.com/heptau/isdoc" target="_blank" rel="noopener" data-i18n-attr="title:star,aria-label:star"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></a>
			<button class="icon-btn" id="theme" type="button" data-i18n-attr="title:toggleTheme,aria-label:toggleTheme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ico sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ico moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
			<div class="langmenu">
				<button class="icon-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu" data-i18n-attr="title:appLangLabel,aria-label:appLangLabel"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
				<div class="menu" id="langMenu" role="menu" hidden></div>
			</div>
		</div>
	</header>

	<main>
		<section id="drop" class="drop">
			<p><strong data-i18n="dropTitle">Drop an .isdoc or .isdocx file here</strong></p>
			<p class="muted" data-i18n="dropText"></p>
		</section>

		<section id="error" class="error" hidden></section>

		<section id="val" class="sig" hidden>
			<div class="sig-head"><span class="dot"></span><strong id="val-title"></strong></div>
			<p id="val-text" class="muted"></p>
			<details id="val-details"><summary data-i18n="valDetails">Validation details</summary><div id="val-body"></div></details>
		</section>

		<section id="sig" class="sig" hidden>
			<div class="sig-head"><span id="sig-icon" class="dot"></span><strong id="sig-title"></strong></div>
			<p id="sig-text" class="muted"></p>
			<details id="sig-details"><summary data-i18n="sigDetails">Signature details</summary><div id="sig-body"></div></details>
		</section>

		<section id="opts" class="opts" hidden>
			<label id="tpl-wrap" hidden><span data-i18n="tplLabel">Invoice layout</span>
				<select id="tpl"></select></label>
			<label id="inv-lang-wrap"><span data-i18n="invLangLabel">Invoice language</span>
				<select id="inv-lang"></select></label>
			<span id="qr" class="qr-opts" hidden>
				<strong data-i18n="showLabel">Show:</strong>
				<label id="opt-spayd" hidden><input type="checkbox" id="chk-spayd"> <span data-i18n="qrSpayd"></span></label>
				<label id="opt-epc" hidden><input type="checkbox" id="chk-epc"> <span data-i18n="qrEpc"></span></label>
				<label id="opt-sig" hidden><input type="checkbox" id="chk-sig"> <span data-i18n="qrSig"></span></label>
			</span>
		</section>

		<section id="att" class="att" hidden>
			<strong data-i18n="attLabel">ISDOCX attachments:</strong> <span id="att-list"></span>
		</section>

		<iframe id="view" data-i18n-attr="title:viewTitle" sandbox="allow-same-origin allow-modals" hidden></iframe>
		<dialog id="signDlg" class="dlg" aria-labelledby="signTitle">
			<form method="dialog" id="signForm">
				<h2 id="signTitle" data-i18n="signTitle">Sign the document</h2>
				<p id="signAlready" class="error warn" hidden data-i18n="signAlready"></p>
				<p class="muted" data-i18n="signChoose">Sign with certificate:</p>
				<div id="certList" class="cert-list" role="radiogroup" data-i18n-attr="aria-label:signChoose"></div>
				<div><button type="button" class="btn" id="certAdd" data-i18n="signAdd">Add certificate…</button>
					<input id="certFile" type="file" multiple accept=".pem,.crt,.cer,.key,.txt" hidden></div>
				<p id="certErr" class="form-error" role="alert" hidden></p>
				<p class="muted small" data-i18n="signAddHint"></p>
				<p class="muted small" data-i18n="signHint"></p>
				<p class="muted small" data-i18n="signFpHint"></p>
				<div class="dlg-actions">
					<button type="button" class="btn" id="signCancel" data-i18n="signCancel">Cancel</button>
					<button type="button" class="btn primary" id="signDo" data-i18n="signDo" disabled>Sign and download</button>
				</div>
			</form>
		</dialog>
	</main>

	<script src="js/version.js"></script>
	<script src="vendor/jszip.min.js"></script>
	<script src="vendor/qrcode.js"></script>
	<script src="js/xslt-config.js"></script>
	<script src="vendor/xslt-polyfill.min.js" charset="utf-8"></script>
	<script type="module" src="js/app.js"></script>
	<div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" class="btn" id="toast-action" hidden></button></div>
</body>
</html>
